<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f0">
  <title>Suivi financier</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
    :root{--bg:#f4f5f0;--surface:#fff;--surface-2:#eef0e9;--text:#18201b;--muted:#717970;--line:#dde1d9;--green:#1d6f4b;--green-2:#dff3e8;--red:#c54a45;--red-2:#fbe7e4;--lime:#c7f36b;--shadow:0 18px 50px rgba(24,32,27,.08)}
    [data-theme="dark"]{--bg:#111512;--surface:#191f1b;--surface-2:#222a25;--text:#f2f5ef;--muted:#9da69e;--line:#303a33;--green:#6bd19d;--green-2:#18392a;--red:#ff8e87;--red-2:#402321;--lime:#b9e866;--shadow:0 18px 50px rgba(0,0,0,.25)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'DM Sans',sans-serif;transition:.25s;padding-bottom:110px}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;padding:28px 34px 56px}
    header{display:flex;align-items:center;justify-content:flex-end;margin-bottom:24px}.header-actions,.row{display:flex;align-items:center;gap:10px}.icon-btn,.ghost,.primary{border:0;border-radius:12px;min-height:42px;padding:0 15px;background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}.icon-btn{width:42px;padding:0;font-size:18px}.primary{background:var(--text);color:var(--bg);box-shadow:none}.primary:hover{transform:translateY(-1px)}
    .hero{margin-bottom:18px}.balance{background:var(--text);color:var(--bg);border-radius:26px;padding:30px;min-height:210px;position:relative;overflow:hidden}.balance:after{content:"";position:absolute;width:260px;height:260px;border:55px solid var(--lime);border-radius:50%;right:-80px;top:-130px;opacity:.16}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:700;opacity:.65}.balance-value{font:800 clamp(40px,6vw,68px) Manrope;margin:12px 0 20px;letter-spacing:-.06em}.delta{display:inline-flex;gap:7px;align-items:center;background:rgba(255,255,255,.1);padding:8px 11px;border-radius:100px}.delta.good{color:var(--lime)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px}.stat-head{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:600}.dot{width:9px;height:9px;border-radius:50%}.dot.green{background:var(--green)}.dot.red{background:var(--red)}.dot.gray{background:var(--muted)}.stat strong{display:block;font:800 25px Manrope;margin-top:10px}.stat small{color:var(--muted)}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:20px}.panel h2{font:800 19px Manrope;margin:0}.panel-sub{color:var(--muted);font-size:12px;margin-top:3px}.filters{display:flex;gap:8px;flex-wrap:wrap}.control{border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:10px;padding:9px 11px;outline:none}.search{min-width:180px}.transactions{display:flex;flex-direction:column}.transaction{display:grid;grid-template-columns:43px minmax(130px,1fr) 130px 120px 42px;align-items:center;gap:12px;padding:14px 4px;border-top:1px solid var(--line)}.transaction:first-child{border-top:0}.tx-icon{width:40px;height:40px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}.tx-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx-meta,.tx-date{font-size:12px;color:var(--muted)}.amount{text-align:right;font:700 15px Manrope}.amount.income{color:var(--green)}.amount.expense{color:var(--text)}.more{opacity:0;border:0;background:none;color:var(--muted);font-size:18px}.transaction:hover .more{opacity:1}.empty{text-align:center;padding:50px;color:var(--muted)}
    .chart-wrap{display:grid;place-items:center;margin:24px 0;position:relative}.donut{width:190px;height:190px;border-radius:50%;background:conic-gradient(var(--green) 0 40%,#ef9b59 40% 70%,#7d8bdd 70% 100%);position:relative}.donut:after{content:"";position:absolute;inset:35px;border-radius:50%;background:var(--surface)}.chart-center{position:absolute;z-index:1;text-align:center}.chart-center strong{font:800 22px Manrope;display:block}.chart-center small{color:var(--muted)}.legend{display:flex;flex-direction:column;gap:12px}.legend-row{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:9px}.legend-row span{color:var(--muted)}.legend-row strong{font-size:13px}
    .add-dock{position:fixed;z-index:20;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:20px;box-shadow:0 15px 45px rgba(18,27,21,.2);backdrop-filter:blur(14px)}.add-main{border:0;border-radius:14px;min-width:190px;height:54px;padding:0 25px;background:var(--text);color:var(--bg);font:800 16px Manrope;box-shadow:0 7px 20px rgba(18,27,21,.22);transition:transform .18s,box-shadow .18s}.add-main:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(18,27,21,.28)}.add-main span{font-size:22px;vertical-align:-1px;margin-right:7px}
    :focus-visible{outline:3px solid var(--lime)!important;outline-offset:3px}.modal-backdrop{position:fixed;inset:0;background:rgba(5,10,7,.55);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal-backdrop.open{display:flex}.modal{background:var(--surface);border-radius:24px;width:min(520px,100%);padding:25px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal h2{font:800 22px Manrope;margin:0}.close{border:0;background:var(--surface-2);color:var(--text);border-radius:50%;width:36px;height:36px}.type-toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);padding:4px;border-radius:13px;margin-bottom:18px}.type-toggle button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:10px;font-weight:700}.type-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}.field{margin-bottom:14px}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--surface-2);color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--green)}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.danger{color:var(--red)!important;margin-right:auto}.toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.side{order:-1}.donut{width:150px;height:150px}.chart-wrap{margin:15px}.side .legend{display:grid;grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){body{padding-bottom:105px}.app{padding:18px 14px 35px}.export-label{display:none}.balance{border-radius:20px;padding:22px;min-height:190px}.balance-value{font-size:43px}.stats{gap:9px}.stat{padding:15px}.stat strong{font-size:20px}.panel{padding:16px;border-radius:18px}.panel-head{display:block}.filters{margin-top:14px}.search{width:100%}.transaction{grid-template-columns:42px 1fr auto 28px}.tx-date{display:none}.transaction .amount{grid-column:3}.more{opacity:1}.field-row{grid-template-columns:1fr}.side .legend{grid-template-columns:1fr 1fr}.add-dock{bottom:max(12px,env(safe-area-inset-bottom));width:calc(100% - 28px)}.add-main{width:100%;height:58px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="header-actions"><button class="icon-btn" id="themeBtn" type="button" aria-label="Changer de thème" title="Changer de thème">☾</button><button class="ghost" id="exportBtn" type="button">↓ <span class="export-label">Exporter</span></button></div>
    </header>

    <section class="hero">
      <article class="balance"><div class="eyebrow">Solde</div><div class="balance-value" id="balance">0 €</div><div class="delta" id="delta">Ce mois-ci</div></article>
    </section>

    <section class="stats">
      <article class="stat"><div class="stat-head"><span>Recettes</span><i class="dot green"></i></div><strong id="income">0 €</strong><small>sur la période</small></article>
      <article class="stat"><div class="stat-head"><span>Dépenses</span><i class="dot red"></i></div><strong id="expenses">0 €</strong><small>sur la période</small></article>
      <article class="stat"><div class="stat-head"><span>Différence</span><i class="dot gray"></i></div><strong id="savings">0 €</strong><small>recettes moins dépenses</small></article>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head"><div><h2>Recettes et dépenses</h2><div class="panel-sub" id="count">0 opération</div></div><div class="filters"><input class="control search" id="search" placeholder="⌕  Rechercher"><select class="control" id="period"><option value="month">Ce mois</option><option value="all">Tout</option><option value="income">Recettes</option><option value="expense">Dépenses</option></select></div></div>
        <div class="transactions" id="transactions"></div>
      </article>
      <aside class="panel side"><div class="panel-head"><div><h2>Où part votre argent ?</h2><div class="panel-sub">Répartition des dépenses</div></div></div><div class="chart-wrap"><div class="donut" id="donut"></div><div class="chart-center"><strong id="chartTotal">0 €</strong><small>Total</small></div></div><div class="legend" id="legend"></div></aside>
    </section>
  </main>

  <div class="add-dock"><button class="add-main" id="addBtn" type="button" aria-label="Ajouter une recette ou une dépense"><span>＋</span>Ajouter</button></div>

  <div class="modal-backdrop" id="modal"><form class="modal" id="form"><div class="modal-head"><h2 id="modalTitle">Nouvelle opération</h2><button type="button" class="close" data-close>×</button></div><div class="type-toggle"><button type="button" class="active" data-type="expense">Dépense</button><button type="button" data-type="income">Recette</button></div><div class="field"><label>Montant</label><input id="amountInput" type="number" min="0.01" step="0.01" placeholder="0,00 €" required autofocus></div><div class="field"><label>Description</label><input id="descriptionInput" maxlength="60" placeholder="Ex. Courses de la semaine" required></div><div class="field-row"><div class="field"><label>Catégorie</label><select id="categoryInput"></select></div><div class="field"><label>Date</label><input id="dateInput" type="date" required></div></div><div class="modal-actions"><button type="button" class="ghost danger" id="deleteBtn" hidden>Supprimer</button><button type="button" class="ghost" data-close>Annuler</button><button class="primary">Enregistrer</button></div></form></div>
  <div class="toast" id="toast"></div>

  <script>
    const CATEGORIES={Logement:['⌂','#7d8bdd'],Alimentation:['◉','#ef9b59'],Transport:['↗','#e0c255'],Loisirs:['◇','#d77bb3'],Santé:['＋','#65b6a2'],Shopping:['□','#8c73c9'],Salaire:['↙','#4b9d72'],Autre:['•','#8f9991']};
    const expenseCats=['Logement','Alimentation','Transport','Loisirs','Santé','Shopping','Autre'];
    const incomeCats=['Salaire','Autre'];
    const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
    const today=new Date(), iso=d=>d.toISOString().slice(0,10), shift=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
    const demo=[{id:1,type:'income',amount:2800,description:'Salaire',category:'Salaire',date:shift(3)},{id:2,type:'expense',amount:820,description:'Loyer',category:'Logement',date:shift(5)},{id:3,type:'expense',amount:84.3,description:'Courses',category:'Alimentation',date:shift(7)},{id:4,type:'expense',amount:45,description:'Pass transport',category:'Transport',date:shift(9)},{id:5,type:'expense',amount:29.9,description:'Cinéma & dîner',category:'Loisirs',date:shift(12)}];
    let transactions=JSON.parse(localStorage.getItem('clair-transactions')||'null')||demo;
    let editingId=null, txType='expense';
    const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n);
    const save=()=>localStorage.setItem('clair-transactions',JSON.stringify(transactions));
    const isMonth=date=>{const d=new Date(date+'T12:00:00');return d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear()};
    function visible(){const q=$('#search').value.toLowerCase(),p=$('#period').value;return transactions.filter(t=>(p==='all'||(p==='month'&&isMonth(t.date))||p===t.type)&&(t.description+' '+t.category).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date))}
    function render(){const month=transactions.filter(t=>isMonth(t.date)), inc=month.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0), exp=month.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0), allBalance=transactions.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
      $('#balance').textContent=money(allBalance);$('#income').textContent=money(inc);$('#expenses').textContent=money(exp);$('#savings').textContent=money(inc-exp);$('#delta').textContent=(inc-exp>=0?'↑ ':'↓ ')+money(Math.abs(inc-exp))+' ce mois';$('#delta').className='delta '+(inc-exp>=0?'good':'');
      const list=visible();$('#count').textContent=list.length+' opération'+(list.length>1?'s':'');$('#transactions').innerHTML=list.length?list.map(t=>`<div class="transaction"><div class="tx-icon">${CATEGORIES[t.category]?.[0]||'•'}</div><div><div class="tx-name">${escapeHtml(t.description)}</div><div class="tx-meta">${t.category}</div></div><div class="tx-date">${new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric'}).format(new Date(t.date+'T12:00:00'))}</div><div class="amount ${t.type}">${t.type==='income'?'+':'−'} ${money(t.amount)}</div><button class="more" onclick="editTx(${t.id})" title="Modifier">•••</button></div>`).join(''):'<div class="empty">Aucune opération ici.<br>Ajoutez une recette ou une dépense.</div>';
      renderChart(month.filter(t=>t.type==='expense'));
    }
    function renderChart(items){const sums={};items.forEach(t=>sums[t.category]=(sums[t.category]||0)+t.amount);const entries=Object.entries(sums).sort((a,b)=>b[1]-a[1]),total=entries.reduce((s,e)=>s+e[1],0);let cursor=0;const slices=entries.map(([cat,val])=>{const start=cursor;cursor+=total?val/total*100:0;return `${CATEGORIES[cat]?.[1]||'#999'} ${start}% ${cursor}%`});$('#donut').style.background=slices.length?`conic-gradient(${slices.join(',')})`:'var(--surface-2)';$('#chartTotal').textContent=money(total);$('#legend').innerHTML=entries.length?entries.slice(0,6).map(([cat,val])=>`<div class="legend-row"><i class="dot" style="background:${CATEGORIES[cat]?.[1]}"></i><span>${cat}</span><strong>${Math.round(val/total*100)} %</strong></div>`).join(''):'<div class="empty">Pas encore de dépenses</div>'}
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function setType(type){txType=type;$$('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===type));const cats=type==='income'?incomeCats:expenseCats;$('#categoryInput').innerHTML=cats.map(c=>`<option>${c}</option>`).join('')}
    function openModal(tx=null){editingId=tx?.id||null;setType(tx?.type||'expense');$('#modalTitle').textContent=tx?'Modifier l’opération':'Nouvelle opération';$('#amountInput').value=tx?.amount||'';$('#descriptionInput').value=tx?.description||'';$('#dateInput').value=tx?.date||iso(today);if(tx)$('#categoryInput').value=tx.category;$('#deleteBtn').hidden=!tx;$('#modal').classList.add('open');setTimeout(()=>$('#amountInput').focus(),50)}
    function closeModal(){$('#modal').classList.remove('open');editingId=null}window.editTx=id=>openModal(transactions.find(t=>t.id===id));
    function notify(message){$('#toast').textContent=message;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
    $('#form').addEventListener('submit',e=>{e.preventDefault();const wasEditing=Boolean(editingId),tx={id:editingId||Date.now(),type:txType,amount:Number($('#amountInput').value),description:$('#descriptionInput').value.trim(),category:$('#categoryInput').value,date:$('#dateInput').value};if(editingId)transactions=transactions.map(t=>t.id===editingId?tx:t);else transactions.push(tx);save();closeModal();render();notify(wasEditing?'Opération modifiée':'Opération ajoutée')});
    $('#deleteBtn').onclick=()=>{transactions=transactions.filter(t=>t.id!==editingId);save();closeModal();render();notify('Opération supprimée')};
    $('#addBtn').onclick=()=>openModal();$$('[data-close]').forEach(b=>b.onclick=closeModal);$$('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};$('#search').oninput=render;$('#period').onchange=render;
    $('#exportBtn').onclick=()=>{const rows=[['Date','Type','Catégorie','Description','Montant'],...transactions.map(t=>[t.date,t.type,t.category,t.description,t.amount.toFixed(2)])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='mes-finances.csv';a.click();URL.revokeObjectURL(url);notify('Export CSV téléchargé')};
    const storedTheme=localStorage.getItem('clair-theme');if(storedTheme)document.documentElement.dataset.theme=storedTheme;function themeIcon(){$('#themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾'}themeIcon();$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('clair-theme',dark?'light':'dark');themeIcon()};
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='n'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))openModal()});render();
  </script>
</body>
</html>
